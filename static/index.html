<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nail Salon Tycoon</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Nail Salon Tycoon</h1>
    <div class="stats">
      <span class="stat" id="stat-client">Client 1 of 6</span>
      <span class="stat" id="stat-earned">Earned $0</span>
      <span class="stat" id="stat-goal">Goal $150</span>
      <span class="stat stars" id="stat-stars"></span>
    </div>
  </header>

  <main class="layout">
    <!-- The work table, seen from the nail technician's seat (R8). -->
    <section class="stage" id="stage" data-area="hands" aria-label="Your work table">
      <svg viewBox="0 0 600 440" role="img" aria-labelledby="stage-title">
        <title id="stage-title">The client's nails on your work table</title>
        <defs>
          <linearGradient id="g-table" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffe3f1"/>
            <stop offset="1" stop-color="#e3f4ff"/>
          </linearGradient>
          <pattern id="p-towel" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="40" fill="#ff9fcf"/>
            <rect width="40" height="10" fill="#ffc2e2"/>
            <rect y="20" width="40" height="6" fill="#fff0f8"/>
          </pattern>
          <linearGradient id="g-file" x1="0" x2="1">
            <stop offset="0" stop-color="#8e44ec"/>
            <stop offset="1" stop-color="#ff3fa4"/>
          </linearGradient>
          <pattern id="p-grit" width="6" height="6" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".45"/>
          </pattern>
          <radialGradient id="g-bubble" cx=".35" cy=".35" r=".7">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset=".6" stop-color="#b9f3ff" stop-opacity=".7"/>
            <stop offset="1" stop-color="#ffb3e6" stop-opacity=".8"/>
          </radialGradient>
        </defs>

        <rect width="600" height="440" fill="url(#g-table)"/>
        <rect x="110" y="30" width="380" height="390" rx="28" fill="url(#p-towel)" opacity=".85"/>

        <!-- Client's hand: fingertips point toward you, so the nails face you. -->
        <g id="hand-view" class="view">
          <rect x="226" y="-20" width="148" height="70" rx="22" fill="#1cc7c1"/>
          <rect x="226" y="34" width="148" height="12" fill="#ffd60a"/>
          <path class="skin" d="M244 44 L356 44 L372 168 Q374 200 352 206 L248 206 Q226 200 228 168 Z"/>
          <g class="digits"></g>
        </g>

        <!-- Client's foot on the footrest, toes toward you. -->
        <g id="foot-view" class="view">
          <rect x="170" y="150" width="260" height="190" rx="40" fill="#8e44ec" opacity=".35"/>
          <rect x="232" y="-20" width="136" height="64" rx="18" fill="#2f6bff"/>
          <rect x="232" y="30" width="136" height="12" fill="#ff8c1a"/>
          <path class="skin" d="M248 40 L352 40 L374 150 Q392 214 386 246 L216 246 Q208 208 226 150 Z"/>
          <g class="digits"></g>
        </g>

        <!-- Tools: each step's animation moves one of these (see style.css). -->
        <g id="tools">
          <g id="soap" class="tool">
            <circle cx="200" cy="230" r="16" style="--d:0s"/>
            <circle cx="240" cy="300" r="11" style="--d:.15s"/>
            <circle cx="300" cy="320" r="20" style="--d:.3s"/>
            <circle cx="360" cy="300" r="13" style="--d:.1s"/>
            <circle cx="410" cy="240" r="18" style="--d:.25s"/>
            <circle cx="390" cy="160" r="10" style="--d:.4s"/>
            <circle cx="210" cy="150" r="12" style="--d:.35s"/>
            <circle cx="270" cy="250" r="9"  style="--d:.5s"/>
            <circle cx="330" cy="200" r="14" style="--d:.2s"/>
            <circle cx="300" cy="120" r="8"  style="--d:.55s"/>
          </g>

          <g id="cotton" class="tool">
            <circle r="34" fill="#ffffff" stroke="#e6e0ff" stroke-width="3"/>
            <circle r="24" fill="none" stroke="#f1ecff" stroke-width="2" stroke-dasharray="3 5"/>
            <ellipse cx="-6" cy="-24" rx="18" ry="7" fill="#7d5a6e" opacity=".55"/>
          </g>

          <g id="file" class="tool">
            <rect x="-80" y="-11" width="160" height="22" rx="11" fill="url(#g-file)"/>
            <rect x="-80" y="-11" width="160" height="22" rx="11" fill="url(#p-grit)"/>
          </g>

          <g id="buffer" class="tool">
            <rect x="-46" y="-20" width="92" height="40" rx="10" fill="#ffffff"/>
            <rect x="-46" y="-20" width="23" height="40" rx="6" fill="#ff3fa4"/>
            <rect x="-23" y="-20" width="23" height="40" fill="#ffd60a"/>
            <rect x="0"   y="-20" width="23" height="40" fill="#7bd629"/>
            <rect x="23"  y="-20" width="23" height="40" rx="6" fill="#2f6bff"/>
          </g>

          <g id="bottle" class="tool">
            <rect x="482" y="300" width="56" height="70" rx="14" class="polish-fill"/>
            <rect x="490" y="308" width="10" height="44" rx="5" fill="#ffffff" opacity=".5"/>
            <rect x="496" y="262" width="28" height="42" rx="6" fill="#222034"/>
          </g>
          <g id="brush" class="tool">
            <rect x="-4" y="-110" width="8" height="96" rx="4" fill="#222034"/>
            <path d="M-7 -16 L7 -16 L5 4 Q0 10 -5 4 Z" class="polish-fill"/>
          </g>

          <g id="sparkles" class="tool">
            <path d="M250 250 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z" fill="#ffd60a"/>
            <path d="M330 230 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5 Z" fill="#ffffff"/>
            <path d="M390 280 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z" fill="#ff3fa4"/>
            <path d="M210 300 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z" fill="#1cc7c1"/>
            <path d="M300 330 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5 Z" fill="#8e44ec"/>
          </g>
        </g>
      </svg>

      <div class="speech" id="speech" aria-live="polite"></div>
      <div class="banner" id="banner" aria-live="polite"></div>
    </section>

    <section class="panel">
      <div class="card client-card" id="client-card">
        <p class="loading">Opening the salon…</p>
      </div>

      <div class="card">
        <h2>Pick your next step</h2>
        <div class="steps" id="steps"></div>
        <h3>Steps so far</h3>
        <ol class="taken" id="taken"><li class="empty">None yet</li></ol>
        <button class="finish" id="finish" type="button">Finish service</button>
      </div>
    </section>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script src="/static/app.js"></script>
</body>
</html>
